<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Copilot</title>
  <style>
    body {
      background: #090d16;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      line-height: 1.4;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 8px;
    }
    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #64748b;
      margin-right: 6px;
    }
    .active { background: #22c55e; }
    .thinking { background: #f59e0b; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-toggle { background: #22c55e; color: #022c22; }
    .btn-toggle.recording { background: #ef4444; color: #fff; }
    .btn-clear { background: #334155; color: #cbd5e1; flex: 0 0 80px; }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }
    .q-text {
      color: #94a3b8;
      font-size: 13px;
      font-style: italic;
      margin-bottom: 6px;
    }
    .a-text {
      color: #38bdf8;
      font-size: 15px;
      font-weight: 500;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="status-bar">
    <div style="font-weight: 700; font-size: 16px;">AI Mobile Copilot</div>
    <div><span id="dot" class="status-dot"></span><span id="status-text" style="font-size: 13px; color:#94a3b8;">Idle</span></div>
  </div>

  <input type="password" id="geminiKey" placeholder="Paste Gemini API Key (AIzaSy...)" />

  <div class="btn-row">
    <button id="toggleBtn" class="btn-toggle" onclick="toggleMic()">Start Listening</button>
    <button class="btn-clear" onclick="clearFeed()">Clear</button>
  </div>

  <div id="feed"></div>

  <script>
    let recognition;
    let listening = false;
    let wakeLock = null;

    async function keepScreenOn() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (e) {}
    }

    function setupSpeech() {
      const SpeechApi = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechApi) {
        alert("Microphone recognition not supported in this browser. Please use Chrome on Android or Safari on iOS.");
        return null;
      }
      const rec = new SpeechApi();
      rec.continuous = true;
      rec.interimResults = false;
      rec.lang = 'en-US';

      rec.onresult = async (evt) => {
        const text = evt.results[evt.results.length - 1][0].transcript.trim();
        if (text.length > 5) {
          updateStatus("thinking", "Answering...");
          await queryGemini(text);
          if (listening) updateStatus("active", "Listening...");
        }
      };

      rec.onerror = () => {};
      rec.onend = () => {
        if (listening) rec.start();
      };
      return rec;
    }

    function updateStatus(state, label) {
      const dot = document.getElementById('dot');
      const text = document.getElementById('status-text');
      dot.className = 'status-dot ' + (state === 'active' ? 'active' : state === 'thinking' ? 'thinking' : '');
      text.innerText = label;
    }

    async function toggleMic() {
      const key = document.getElementById('geminiKey').value.trim();
      if (!key) {
        alert("Please paste your Gemini API key first!");
        return;
      }
      localStorage.setItem('gemini_key', key);

      if (!recognition) recognition = setupSpeech();
      const btn = document.getElementById('toggleBtn');

      if (!listening) {
        recognition.start();
        listening = true;
        btn.innerText = "Stop Listening";
        btn.classList.add("recording");
        updateStatus("active", "Listening...");
        await keepScreenOn();
      } else {
        recognition.stop();
        listening = false;
        btn.innerText = "Start Listening";
        btn.classList.remove("recording");
        updateStatus("idle", "Idle");
      }
    }

    async function queryGemini(promptText) {
      const key = document.getElementById('geminiKey').value.trim();
      const feed = document.getElementById('feed');
      
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="q-text">Q: "${promptText}"</div><div class="a-text">Thinking...</div>`;
      feed.prepend(card);
      const answerBox = card.querySelector('.a-text');

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: {
              parts: [{ text: "You are a real-time interview co-pilot. Listen to the question and provide a direct 1-sentence answer followed by 3 short bullet points. Keep it under 50 words total so the user can scan it instantly." }]
            },
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        const data = await res.json();
        if (!res.ok) {
          answerBox.innerText = `Error (${res.status}): ${data.error ? data.error.message : 'Request failed'}`;
          return;
        }
        answerBox.innerText = data.candidates[0].content.parts[0].text;
      } catch (err) {
        answerBox.innerText = "Network Error: " + err.message;
      }
    }

    function clearFeed() {
      document.getElementById('feed').innerHTML = '';
    }

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_key');
      if (savedKey) document.getElementById('geminiKey').value = savedKey;
    };
  </script>
</body>
</html>
