<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Copilot Pro</title>
  <style>
    body {
      background: #080d1a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 14px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .status-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: #1e293b;
      color: #94a3b8;
    }
    .status-active { background: #064e3b; color: #34d399; }
    .status-working { background: #78350f; color: #fbbf24; }
    
    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #131d31;
      color: #fff;
      font-size: 13px;
      margin-bottom: 8px;
    }
    
    .btn-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-start { background: #10b981; color: #022c22; }
    .btn-stop { background: #ef4444; color: #fff; }
    .btn-clear { background: #1e293b; color: #94a3b8; flex: 0 0 70px; }

    .live-preview {
      font-size: 12px;
      color: #64748b;
      font-style: italic;
      min-height: 18px;
      margin-bottom: 8px;
    }

    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-left: 4px solid #38bdf8;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      animation: fadeIn 0.2s ease-in;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .question {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 8px;
      font-weight: 500;
    }
    .answer {
      font-size: 14.5px;
      color: #f8fafc;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .answer b, .answer strong { color: #38bdf8; }
    .answer code { background: #1e293b; padding: 2px 4px; border-radius: 4px; color: #f472b6; font-size: 13px; }
  </style>
</head>
<body>

  <div class="header">
    <div style="font-weight: 800; font-size: 16px; color:#38bdf8;">Interview Copilot Pro</div>
    <span id="status" class="status-badge">Idle</span>
  </div>

  <input type="password" id="geminiKey" placeholder="Paste Gemini API Key (AIzaSy...)" />

  <div class="btn-row">
    <button id="toggleBtn" class="btn-start" onclick="toggleListening()">Start Listening</button>
    <button class="btn-clear" onclick="clearFeed()">Clear</button>
  </div>

  <div id="live" class="live-preview"></div>
  <div id="feed"></div>

  <script>
    let recognition;
    let isListening = false;
    let wakeLock = null;

    // Prevent phone screen from dimming/sleeping
    async function requestWake() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }

    function initSpeech() {
      const SpeechApi = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechApi) {
        alert("Microphone recognition not supported in this browser. Please use Chrome.");
        return null;
      }
      const rec = new SpeechApi();
      rec.continuous = true;
      rec.interimResults = true;
      // 'en-IN' is tuned for Indian accents and prevents word chopping
      rec.lang = 'en-IN';

      rec.onresult = (evt) => {
        let interimText = '';
        let finalText = '';

        for (let i = evt.resultIndex; i < evt.results.length; ++i) {
          if (evt.results[i].isFinal) {
            finalText += evt.results[i][0].transcript;
          } else {
            interimText += evt.results[i][0].transcript;
          }
        }

        if (interimText) {
          document.getElementById('live').innerText = 'Hearing: ' + interimText;
        }

        if (finalText.trim().length > 12) {
          document.getElementById('live').innerText = '';
          handleTranscription(finalText.trim());
        }
      };

      rec.onerror = (e) => console.log('Speech error:', e);
      rec.onend = () => {
        if (isListening) rec.start();
      };
      return rec;
    }

    function updateStatus(mode, text) {
      const el = document.getElementById('status');
      el.innerText = text;
      el.className = 'status-badge ' + (mode === 'active' ? 'status-active' : mode === 'working' ? 'status-working' : '');
    }

    async function toggleListening() {
      const key = document.getElementById('geminiKey').value.trim();
      if (!key) {
        alert("Please enter your Gemini API key first.");
        return;
      }
      localStorage.setItem('gemini_key', key);

      if (!recognition) recognition = initSpeech();
      const btn = document.getElementById('toggleBtn');

      if (!isListening) {
        recognition.start();
        isListening = true;
        btn.innerText = "Stop Listening";
        btn.className = "btn-stop";
        updateStatus("active", "Listening...");
        await requestWake();
      } else {
        recognition.stop();
        isListening = false;
        btn.innerText = "Start Listening";
        btn.className = "btn-start";
        updateStatus("idle", "Idle");
      }
    }

    async function handleTranscription(questionText) {
      updateStatus("working", "Synthesizing...");
      const key = document.getElementById('geminiKey').value.trim();
      const feed = document.getElementById('feed');

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="question">Q: "${questionText}"</div><div class="answer">Generating technical response...</div>`;
      feed.prepend(card);
      const answerBox = card.querySelector('.answer');

      const systemPrompt = `You are an elite interview co-pilot assisting a Senior Data Engineer & ETL Developer with 3.5 years of hands-on experience (SQL, Snowflake, dbt, Informatica PowerCenter, AWS, Python, Data Warehousing).
When asked an interview question:
1. Provide a sharp, technically rigorous response that sounds like a seasoned practitioner.
2. Structure format:
   - Direct Verdict / Architecture decision (1 strong sentence).
   - 3 to 4 high-impact bullet points detailing implementation, SQL/dbt/Snowflake best practices, or production trade-offs.
   - Mention real-world edge cases (e.g., surrogate keys, SCD Type 2, warehouse clustering, micro-partitions, idempotent pipelines) where relevant.
3. Keep the entire response readable within 10-15 seconds. Avoid generic filler words or fluff.`;

      // Resilient fetch with automatic fallback and retry on 503
      let responseText = null;
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${key}`;
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: systemPrompt }] },
              contents: [{ parts: [{ text: questionText }] }],
              generationConfig: {
                temperature: 0.1,
                maxOutputTokens: 250
              }
            })
          });

          const data = await res.json();
          if (res.ok && data.candidates && data.candidates[0].content) {
            responseText = data.candidates[0].content.parts[0].text;
            break;
          } else if (res.status === 503) {
            // Wait 600ms and retry automatically on 503 capacity errors
            await new Promise(r => setTimeout(r, 600));
          } else {
            responseText = `API Error (${res.status}): ${data.error ? data.error.message : 'Unknown error'}`;
            break;
          }
        } catch (err) {
          responseText = "Network Error: " + err.message;
          break;
        }
      }

      answerBox.innerText = responseText || "Server busy under high load. Please repeat the query.";
      if (isListening) updateStatus("active", "Listening...");
    }

    function clearFeed() {
      document.getElementById('feed').innerHTML = '';
      document.getElementById('live').innerText = '';
    }

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_key');
      if (savedKey) document.getElementById('geminiKey').value = savedKey;
    };
  </script>
</body>
</html>
