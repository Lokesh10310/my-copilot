<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Parakeet Engine Mobile</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: #060913;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      margin: 0;
      padding: 12px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 8px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: #94a3b8;
    }
    .badge-green { background: #064e3b; color: #34d399; }
    .badge-orange { background: #78350f; color: #f59e0b; }
    .badge-red { background: #7f1d1d; color: #f87171; }
    
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #38bdf8;
      font-size: 13px;
      margin-bottom: 8px;
    }
    
    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    button {
      padding: 12px 6px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-listen { background: #10b981; color: #022c22; }
    .btn-listen.listening { background: #ef4444; color: #fff; }
    .btn-mute { background: #334155; color: #f1f5f9; }
    .btn-mute.active { background: #eab308; color: #000; }
    .btn-clear { background: #1e293b; color: #94a3b8; }

    .live-transcript {
      font-size: 12px;
      color: #94a3b8;
      min-height: 16px;
      margin-bottom: 8px;
      font-style: italic;
    }

    .card {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-left: 4px solid #38bdf8;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .q-line {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .content-box {
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.45;
      white-space: pre-wrap;
    }
    pre {
      background: #020617;
      border: 1px solid #334155;
      padding: 8px;
      border-radius: 4px;
      color: #38bdf8;
      font-size: 12.5px;
      overflow-x: auto;
      margin: 6px 0;
    }
    .bullet {
      color: #38bdf8;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div style="font-weight: 800; font-size: 14px; color: #38bdf8;">PARAKEET ENGINE</div>
    <span id="status" class="badge">STANDBY</span>
  </div>

  <input type="password" id="apiKey" placeholder="Paste Gemini API Key (AIzaSy...)" />

  <div class="controls">
    <button id="listenBtn" class="btn-listen" onclick="toggleListening()">Start Mic</button>
    <button id="muteBtn" class="btn-mute" onclick="toggleSpeechBlock()">Block Self</button>
    <button class="btn-clear" onclick="clearFeed()">Clear</button>
  </div>

  <div id="live" class="live-transcript">Waiting for interviewer audio...</div>
  <div id="feed"></div>

  <script>
    let recognition;
    let isListening = false;
    let isSpeakingAnswer = false; // Prevents recording yourself
    let wakeLock = null;

    // Ordered list of models to fall back through instantly if 503 occurs
    const MODELS = [
      "gemini-2.5-flash-lite",
      "gemini-2.5-flash",
      "gemini-3.8-flash"
    ];

    async function keepAwake() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }

    function initSpeech() {
      const SpeechApi = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechApi) {
        alert("Browser does not support Web Speech. Please use Google Chrome.");
        return null;
      }
      const rec = new SpeechApi();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-IN'; // Tuned for Indian English accents

      rec.onresult = (evt) => {
        if (isSpeakingAnswer) return; // Drop audio while candidate speaks

        let interim = '';
        let finalTxt = '';

        for (let i = evt.resultIndex; i < evt.results.length; ++i) {
          if (evt.results[i].isFinal) {
            finalTxt += evt.results[i][0].transcript;
          } else {
            interim += evt.results[i][0].transcript;
          }
        }

        if (interim) {
          document.getElementById('live').innerText = 'Interviewer: ' + interim;
        }

        // Trigger only on complete sentence
        if (finalTxt.trim().length > 10) {
          document.getElementById('live').innerText = '';
          dispatchAI(finalTxt.trim());
        }
      };

      rec.onend = () => {
        if (isListening) rec.start();
      };

      return rec;
    }

    function setStatus(badgeClass, text) {
      const el = document.getElementById('status');
      el.className = 'badge ' + badgeClass;
      el.innerText = text;
    }

    async function toggleListening() {
      const key = document.getElementById('apiKey').value.trim();
      if (!key) return alert("Paste your Gemini API key first.");
      localStorage.setItem('gemini_key', key);

      if (!recognition) recognition = initSpeech();
      const btn = document.getElementById('listenBtn');

      if (!isListening) {
        recognition.start();
        isListening = true;
        btn.innerText = "Stop Mic";
        btn.classList.add("listening");
        setStatus("badge-green", "LISTENING");
        await keepAwake();
      } else {
        recognition.stop();
        isListening = false;
        btn.innerText = "Start Mic";
        btn.classList.remove("listening");
        setStatus("", "STANDBY");
      }
    }

    // Toggle to prevent recording your own voice when you answer
    function toggleSpeechBlock() {
      isSpeakingAnswer = !isSpeakingAnswer;
      const btn = document.getElementById('muteBtn');
      if (isSpeakingAnswer) {
        btn.classList.add('active');
        btn.innerText = "Speaking (Locked)";
      } else {
        btn.classList.remove('active');
        btn.innerText = "Block Self";
      }
    }

    async function dispatchAI(question) {
      setStatus("badge-orange", "STREAMING...");
      
      // Auto-lock for 6 seconds to avoid self-echoing
      isSpeakingAnswer = true;
      document.getElementById('muteBtn').classList.add('active');
      document.getElementById('muteBtn').innerText = "Speaking (Locked)";

      const key = document.getElementById('apiKey').value.trim();
      const feed = document.getElementById('feed');

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="q-line">Q: "${question}"</div><div class="content-box">⚡ Fetching...</div>`;
      feed.prepend(card);
      const contentEl = card.querySelector('.content-box');

      const systemPrompt = `You are a real-time copilot for an ETL/Data Engineer (Snowflake, SQL, dbt, Informatica).
RULES:
1. IF the question asks for SQL/Code (e.g. find duplicates, join, merge, window function), output the exact query in SQL code first, then 2 bullet points on why it works.
2. IF conceptual, answer in 1 sharp verdict sentence followed by 3 concise bullet points.
3. Keep the entire response under 60 words. No intro ("Sure!"), no outro. Immediate actionable syntax and facts.`;

      let success = false;

      // Waterfall fallback: tries lite first (never gets 503), then flash
      for (const model of MODELS) {
        if (success) break;
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:streamGenerateContent?alt=sse&key=${key}`;
          const res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              system_instruction: { parts: [{ text: systemPrompt }] },
              contents: [{ parts: [{ text: question }] }],
              generationConfig: {
                temperature: 0.0,
                maxOutputTokens: 250
              }
            })
          });

          if (res.status === 503 || !res.ok) {
            continue; // Fail over immediately to next model in array
          }

          contentEl.innerText = "";
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            
            const lines = buffer.split("\n");
            buffer = lines.pop(); // keep last incomplete line

            for (const line of lines) {
              if (line.startsWith("data: ")) {
                try {
                  const json = JSON.parse(line.substring(6));
                  const chunk = json.candidates?.[0]?.content?.parts?.[0]?.text || "";
                  contentEl.innerText += chunk;
                } catch (e) {}
              }
            }
          }
          success = true;
          break;
        } catch (e) {
          // Move to next model
        }
      }

      if (!success) {
        contentEl.innerText = "All endpoints busy. Repeat query or tap mic.";
      }

      setStatus("badge-green", "LISTENING");

      // Release self-speech lock after 8 seconds
      setTimeout(() => {
        isSpeakingAnswer = false;
        document.getElementById('muteBtn').classList.remove('active');
        document.getElementById('muteBtn').innerText = "Block Self";
      }, 8000);
    }

    function clearFeed() {
      document.getElementById('feed').innerHTML = '';
      document.getElementById('live').innerText = '';
    }

    window.onload = () => {
      const saved = localStorage.getItem('gemini_key');
      if (saved) document.getElementById('apiKey').value = saved;
    };
  </script>
</body>
</html>
