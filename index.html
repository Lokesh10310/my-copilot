
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060913">
  <title>Parakeet Engine Pro</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 14px;
      background: #060913;
      color: #f1f5f9;
      font-family: system-ui, Arial, sans-serif;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-bottom: 12px;
      border-bottom: 1px solid #263247;
      margin-bottom: 14px;
    }

    .brand {
      color: #38bdf8;
      font-family: monospace;
      font-weight: 800;
      font-size: 19px;
    }

    .badge {
      padding: 5px 9px;
      border-radius: 20px;
      background: #1e293b;
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 800;
    }

    .green { background: #064e3b; color: #6ee7b7; }
    .orange { background: #78350f; color: #fcd34d; }
    .red { background: #7f1d1d; color: #fecaca; }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 10px;
      border: 1px solid #334155;
      border-radius: 10px;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 14px;
    }

    .hint {
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .controls {
      display: grid;
      grid-template-columns: 1.4fr 1fr .7fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    button {
      min-height: 54px;
      padding: 10px 5px;
      border: 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    #listenBtn { background: #10b981; color: #022c22; }
    #listenBtn.active { background: #ef4444; color: white; }
    #lockBtn { background: #334155; color: white; }
    #lockBtn.active { background: #eab308; color: #111827; }
    #clearBtn { background: #1e293b; color: #cbd5e1; }

    .live {
      min-height: 42px;
      padding: 10px;
      margin-bottom: 12px;
      border: 1px solid #263247;
      border-radius: 8px;
      color: #94a3b8;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .card {
      padding: 14px;
      margin-bottom: 12px;
      background: #0b1120;
      border: 1px solid #263247;
      border-left: 4px solid #38bdf8;
      border-radius: 10px;
    }

    .question {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .answer {
      color: #f1f5f9;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .foot {
      color: #64748b;
      font-size: 11px;
      line-height: 1.5;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="top">
    <div class="brand">PARAKEET ENGINE</div>
    <span id="status" class="badge">STANDBY</span>
  </div>

  <input
    id="apiKey"
    type="password"
    placeholder="Paste Gemini API key"
    autocomplete="off"
    autocapitalize="off"
    spellcheck="false"
  >

  <div class="hint">
    Paste your key directly from Google AI Studio.
    Never put your API key in this HTML file or commit it to GitHub.
  </div>

  <div class="controls">
    <button id="listenBtn" onclick="toggleListening()">Start Mic</button>
    <button id="lockBtn" onclick="toggleLock()">Block Speech</button>
    <button id="clearBtn" onclick="clearFeed()">Clear</button>
  </div>

  <div id="live" class="live">Ready to listen.</div>
  <div id="feed"></div>

  <div class="foot">
    Requires microphone permission, internet access and an available
    Gemini API model. Browser speech recognition availability varies.
  </div>

<script>
"use strict";

let recognition = null;
let isListening = false;
let isLocked = false;
let isProcessing = false;
let wakeLock = null;
let lastQuestion = "";
let lastQuestionAt = 0;

const $ = id => document.getElementById(id);

function setStatus(text, type = "") {
  $("status").textContent = text;
  $("status").className = "badge " + type;
}

function setLive(text) {
  $("live").textContent = text;
}

function createCard(question) {
  const card = document.createElement("div");
  card.className = "card";

  const q = document.createElement("div");
  q.className = "question";
  q.textContent = "Q: " + question;

  const a = document.createElement("div");
  a.className = "answer";
  a.textContent = "Generating answer...";

  card.append(q, a);
  $("feed").prepend(card);
  return a;
}

function initSpeech() {
  const SpeechAPI =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechAPI) {
    alert("Speech recognition is unavailable. Try Chrome.");
    return null;
  }

  const rec = new SpeechAPI();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = "en-IN";

  rec.onresult = event => {
    if (isLocked || isProcessing) return;

    let interim = "";
    let finalText = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      if (result.isFinal) {
        finalText += result[0].transcript + " ";
      } else {
        interim += result[0].transcript;
      }
    }

    if (interim.trim()) {
      setLive("Hearing: " + interim.trim());
    }

    const question = finalText.trim();

    if (question.length >= 4) {
      dispatchAI(question);
    }
  };

  rec.onerror = event => {
    if (event.error === "not-allowed" ||
        event.error === "service-not-allowed") {
      isListening = false;
      updateMicButton();
      setStatus("MIC DENIED", "red");
      setLive("Allow microphone access in browser settings.");
    } else if (event.error !== "no-speech" &&
               event.error !== "aborted") {
      setLive("Microphone error: " + event.error);
    }
  };

  rec.onend = () => {
    if (!isListening) return;

    setTimeout(() => {
      if (!isListening) return;
      try {
        rec.start();
      } catch (error) {
        // Avoid restarting an already active recognition session.
      }
    }, 250);
  };

  return rec;
}

function updateMicButton() {
  const btn = $("listenBtn");
  btn.textContent = isListening ? "Stop Mic" : "Start Mic";
  btn.classList.toggle("active", isListening);
}

function updateLockButton() {
  const btn = $("lockBtn");
  btn.textContent = isLocked ? "Speech Blocked" : "Block Speech";
  btn.classList.toggle("active", isLocked);
}

async function keepAwake() {
  try {
    if ("wakeLock" in navigator) {
      wakeLock = await navigator.wakeLock.request("screen");
    }
  } catch (error) {
    // Screen wake lock is optional.
  }
}

async function toggleListening() {
  if (isListening) {
    isListening = false;

    if (recognition) {
      try { recognition.stop(); } catch (error) {}
    }

    if (wakeLock) {
      try { await wakeLock.release(); } catch (error) {}
      wakeLock = null;
    }

    updateMicButton();
    setStatus("STANDBY");
    setLive("Microphone stopped.");
    return;
  }

  if (!getApiKey()) {
    alert("Enter a valid Gemini API key first.");
    $("apiKey").focus();
    return;
  }

  if (!recognition) recognition = initSpeech();
  if (!recognition) return;

  try {
    recognition.start();
    isListening = true;
    updateMicButton();
    setStatus("LISTENING", "green");
    setLive("Listening for speech...");
    await keepAwake();
  } catch (error) {
    setStatus("MIC ERROR", "red");
    setLive("Could not start microphone. Try again.");
  }
}

function toggleLock() {
  isLocked = !isLocked;
  updateLockButton();

  setLive(isLocked
    ? "Speech recognition paused."
    : "Speech recognition resumed.");
}

function clearFeed() {
  $("feed").replaceChildren();
  setLive("Feed cleared.");
}

function getApiKey() {
  // Google API keys should contain only ASCII characters.
  // Remove surrounding/invisible whitespace, not arbitrary key characters.
  const key = $("apiKey").value
    .replace(/[\s\u200B-\u200D\uFEFF]/g, "")
    .trim();

  if (!key) return "";

  if (!/^[\x21-\x7E]+$/.test(key)) {
    return "";
  }

  return key;
}

async function dispatchAI(question) {
  question = question.trim();
  if (!question || isProcessing) return;

  const now = Date.now();

  // Ignore duplicate final transcripts.
  if (question === lastQuestion && now - lastQuestionAt < 4000) {
    return;
  }

  lastQuestion = question;
  lastQuestionAt = now;

  const key = getApiKey();

  if (!key) {
    setStatus("INVALID KEY", "red");
    setLive("Check your API key. Paste it again from Google AI Studio.");
    return;
  }

  isProcessing = true;
  setStatus("THINKING", "orange");
  setLive("Sending question to Gemini...");

  const output = createCard(question);
  let succeeded = false;
  let lastError = "No response received.";

  const systemPrompt = `
You are a concise technical interview practice assistant
for ETL and Data Engineering.

Topics: Informatica PowerCenter, SQL, PostgreSQL, Redshift,
Snowflake, dbt, AWS and data warehousing.

Rules:
- SQL questions: output executable SQL first, then up to 2 short notes.
- Conceptual questions: give a direct definition and 3 concise bullets.
- Keep answers under 60 words unless code needs more.
- Be technically accurate and specific.
- No greetings, introductions or filler.
- If a question is unclear, state a brief assumption.
`;

  // Stable model IDs from Google's current model documentation.
  const models = [
    "gemini-3.5-flash-lite",
    "gemini-3.8-flash"
  ];

  try {
    for (const model of models) {
      let response;

      try {
        const url =
          "https://generativelanguage.googleapis.com/v1beta/models/" +
          encodeURIComponent(model) +
          ":streamGenerateContent?alt=sse";

        response = await fetch(url, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-goog-api-key": key
          },
          body: JSON.stringify({
            system_instruction: {
              parts: [{ text: systemPrompt }]
            },
            contents: [{
              role: "user",
              parts: [{ text: question }]
            }],
            generationConfig: {
              temperature: 0.1,
              maxOutputTokens: 180
            }
          })
        });
      } catch (error) {
        lastError = error.message || "Network request failed.";
        continue;
      }

      if (!response.ok) {
        const err = await response.json().catch(() => ({}));
        lastError = err.error?.message ||
          ("HTTP " + response.status + " for " + model);

        // Invalid key/request errors need correction, not a fallback.
        if ([400, 401, 403].includes(response.status)) break;
        continue;
      }

      if (!response.body) {
        lastError = "Streaming is not supported by this browser.";
        continue;
      }

      let answer = "";
      let buffer = "";
      const reader = response.body.getReader();
      const decoder = new TextDecoder();

      try {
        while (true) {
          const result = await reader.read();

          buffer += decoder.decode(
            result.value || new Uint8Array(),
            { stream: !result.done }
          );

          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() || "";

          for (const line of lines) {
            const clean = line.trim();
            if (!clean.startsWith("data:")) continue;

            const payload = clean.slice(5).trim();
            if (!payload || payload === "[DONE]") continue;

            try {
              const data = JSON.parse(payload);
              const parts =
                data.candidates?.[0]?.content?.parts || [];

              for (const part of parts) {
                if (typeof part.text === "string") {
                  answer += part.text;
                }
              }

              // Render each streamed chunk immediately.
              if (answer) output.textContent = answer;

              const blockReason =
                data.promptFeedback?.blockReason;

              if (blockReason) {
                lastError = "Prompt blocked: " + blockReason;
              }
            } catch (error) {
              // Ignore incomplete SSE data lines.
            }
          }

          if (result.done) break;
        }
      } finally {
        reader.releaseLock();
      }

      if (!answer.trim()) {
        lastError = lastError === "No response received."
          ? "Empty response. Check model access and safety feedback."
          : lastError;
        continue;
      }

      succeeded = true;
      break;
    }

    if (!succeeded) {
      output.textContent =
        "Request failed: " + lastError +
        "\n\nCheck your API key, model access, quota and internet connection.";

      setStatus("REQUEST FAILED", "red");
    } else {
      setStatus("ANSWER READY", "green");
    }
  } catch (error) {
    output.textContent = "Error: " +
      (error.message || String(error));
    setStatus("ERROR", "red");
  } finally {
    isProcessing = false;

    if (isListening) {
      setStatus("LISTENING", "green");
      setLive(isLocked
        ? "Speech recognition paused."
        : "Ready for the next question.");
    } else if (succeeded) {
      setStatus("STANDBY");
    }
  }
}

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && isListening) {
    await keepAwake();
  }
});
</script>
</body>
</html>
