<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Parakeet Engine Pro</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: #060913;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      margin: 0;
      padding: 12px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
      margin-bottom: 8px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: #1e293b;
      color: #94a3b8;
    }
    .badge-green { background: #064e3b; color: #34d399; }
    .badge-orange { background: #78350f; color: #f59e0b; }
    
    input {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #38bdf8;
      font-size: 13px;
      margin-bottom: 8px;
    }
    
    .controls {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }
    button {
      padding: 12px 6px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-listen { background: #10b981; color: #022c22; }
    .btn-listen.listening { background: #ef4444; color: #fff; }
    .btn-mute { background: #334155; color: #f1f5f9; }
    .btn-mute.active { background: #eab308; color: #000; }
    .btn-clear { background: #1e293b; color: #94a3b8; }

    .live-transcript {
      font-size: 12px;
      color: #94a3b8;
      min-height: 16px;
      margin-bottom: 8px;
      font-style: italic;
    }

    .card {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-left: 4px solid #38bdf8;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .q-line {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 6px;
    }
    .content-box {
      font-size: 14px;
      color: #e2e8f0;
      line-height: 1.45;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div style="font-weight: 800; font-size: 14px; color: #38bdf8;">PARAKEET ENGINE (GROQ)</div>
    <span id="status" class="badge">STANDBY</span>
  </div>

  <input type="password" id="groqKey" placeholder="Paste Groq API Key (gsk_...)" />

  <div class="controls">
    <button id="listenBtn" class="btn-listen" onclick="toggleListening()">Start Mic</button>
    <button id="muteBtn" class="btn-mute" onclick="toggleSpeechBlock()">Block Self</button>
    <button class="btn-clear" onclick="clearFeed()">Clear</button>
  </div>

  <div id="live" class="live-transcript">Waiting for interviewer audio...</div>
  <div id="feed"></div>

  <script>
    let recognition;
    let isListening = false;
    let isSpeakingAnswer = false;
    let wakeLock = null;

    async function keepAwake() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (e) {}
    }

    function initSpeech() {
      const SpeechApi = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechApi) {
        alert("Microphone not supported. Please use Google Chrome.");
        return null;
      }
      const rec = new SpeechApi();
      rec.continuous = true;
      rec.interimResults = true;
      rec.lang = 'en-IN'; // Indian English accent tuning

      rec.onresult = (evt) => {
        if (isSpeakingAnswer) return; // Ignore your own audio while speaking

        let interim = '';
        let finalTxt = '';

        for (let i = evt.resultIndex; i < evt.results.length; ++i) {
          if (evt.results[i].isFinal) {
            finalTxt += evt.results[i][0].transcript;
          } else {
            interim += evt.results[i][0].transcript;
          }
        }

        if (interim) {
          document.getElementById('live').innerText = 'Hearing: ' + interim;
        }

        if (finalTxt.trim().length > 10) {
          document.getElementById('live').innerText = '';
          dispatchAI(finalTxt.trim());
        }
      };

      rec.onend = () => {
        if (isListening) rec.start();
      };

      return rec;
    }

    function setStatus(badgeClass, text) {
      const el = document.getElementById('status');
      el.className = 'badge ' + badgeClass;
      el.innerText = text;
    }

    async function toggleListening() {
      const key = document.getElementById('groqKey').value.trim();
      if (!key) return alert("Please paste your Groq API key (gsk_...) first.");
      localStorage.setItem('groq_saved_key', key);

      if (!recognition) recognition = initSpeech();
      const btn = document.getElementById('listenBtn');

      if (!isListening) {
        recognition.start();
        isListening = true;
        btn.innerText = "Stop Mic";
        btn.classList.add("listening");
        setStatus("badge-green", "LISTENING");
        await keepAwake();
      } else {
        recognition.stop();
        isListening = false;
        btn.innerText = "Start Mic";
        btn.classList.remove("listening");
        setStatus("", "STANDBY");
      }
    }

    function toggleSpeechBlock() {
      isSpeakingAnswer = !isSpeakingAnswer;
      const btn = document.getElementById('muteBtn');
      if (isSpeakingAnswer) {
        btn.classList.add('active');
        btn.innerText = "Speaking (Locked)";
      } else {
        btn.classList.remove('active');
        btn.innerText = "Block Self";
      }
    }

    async function dispatchAI(question) {
      setStatus("badge-orange", "STREAMING...");
      
      // Auto-lock mic for 8 seconds so your answer is not recorded as a question
      isSpeakingAnswer = true;
      document.getElementById('muteBtn').classList.add('active');
      document.getElementById('muteBtn').innerText = "Speaking (Locked)";

      const key = document.getElementById('groqKey').value.trim();
      const feed = document.getElementById('feed');

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `<div class="q-line">Q: "${question}"</div><div class="content-box">⚡ Fetching...</div>`;
      feed.prepend(card);
      const contentEl = card.querySelector('.content-box');

      const systemPrompt = `You are a silent real-time interview co-pilot for a Senior Data Engineer & ETL Developer (Snowflake, SQL, dbt, Informatica PowerCenter, AWS).
RULES:
1. If the question asks to write SQL/code (e.g., duplicates, window functions, joins), OUTPUT THE EXACT SQL CODE BLOCK FIRST, followed by 2 bullet points on trade-offs.
2. If conceptual, provide 1 direct sentence verdict, followed by 3 high-impact bullet points.
3. Keep the total response under 60 words. Zero pleasantries or introductions. Jump straight to the solution.`;

      try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + key,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            stream: true,
            temperature: 0.1,
            max_tokens: 250,
            messages: [
              { role: "system", content: systemPrompt },
              { role: "user", content: question }
            ]
          })
        });

        if (!res.ok) {
          const errData = await res.json();
          contentEl.innerText = `API Error (${res.status}): ${errData.error?.message || 'Check key'}`;
          setStatus("badge-green", "LISTENING");
          return;
        }

        contentEl.innerText = "";
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          
          const lines = buffer.split("\n");
          buffer = lines.pop();

          for (const line of lines) {
            const cleanLine = line.trim();
            if (cleanLine.startsWith("data: ") && cleanLine !== "data: [DONE]") {
              try {
                const parsed = JSON.parse(cleanLine.substring(6));
                const delta = parsed.choices?.[0]?.delta?.content || "";
                contentEl.innerText += delta;
              } catch (e) {}
            }
          }
        }
      } catch (err) {
        contentEl.innerText = "Network Error: " + err.message;
      }

      setStatus("badge-green", "LISTENING");

      // Auto-unlock mic after 8 seconds
      setTimeout(() => {
        isSpeakingAnswer = false;
        document.getElementById('muteBtn').classList.remove('active');
        document.getElementById('muteBtn').innerText = "Block Self";
      }, 8000);
    }

    function clearFeed() {
      document.getElementById('feed').innerHTML = '';
      document.getElementById('live').innerText = '';
    }

    window.onload = () => {
      const saved = localStorage.getItem('groq_saved_key');
      if (saved) document.getElementById('groqKey').value = saved;
    };
  </script>
</body>
</html>
