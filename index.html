
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#060913">
<title>Parakeet Engine Pro</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:14px;background:#060913;color:#f1f5f9;font-family:system-ui,Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #263247;padding-bottom:13px;margin-bottom:14px}
.brand{font:800 19px monospace;color:#38bdf8}
.badge{font-size:11px;font-weight:800;padding:6px 9px;border-radius:20px;background:#1e293b}
.green{background:#064e3b;color:#6ee7b7}.orange{background:#78350f;color:#fcd34d}.red{background:#7f1d1d;color:#fecaca}
input{width:100%;padding:13px;margin-bottom:10px;border:1px solid #334155;border-radius:9px;background:#0f172a;color:#f1f5f9;font-size:14px}
.hint{font-size:12px;color:#94a3b8;line-height:1.5;margin-bottom:12px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
button{border:0;border-radius:9px;padding:13px 8px;min-height:48px;font-size:13px;font-weight:800;cursor:pointer}
.primary{background:#10b981;color:#022c22}.stop{background:#ef4444;color:white}.secondary{background:#334155;color:white}.clear{background:#1e293b;color:#cbd5e1}
.panel,.card{padding:13px;background:#0b1120;border:1px solid #263247;border-radius:10px;margin-bottom:12px}
.panel{border-left:4px solid #38bdf8}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:#94a3b8;margin-bottom:7px}
.transcript,.answer{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;font-size:14px;min-height:36px}
.card{border-left:4px solid #10b981}.question{font-size:12px;color:#94a3b8;margin-bottom:9px}
.answer{font-size:15px}.foot{font-size:11px;color:#64748b;line-height:1.5;margin-top:18px}
</style>
</head>
<body>

<header>
  <div class="brand">PARAKEET ENGINE</div>
  <span id="status" class="badge">STANDBY</span>
</header>

<input id="apiKey" type="password" placeholder="Paste Gemini API key" autocomplete="off">
<div class="hint">Mock-interview practice with automatic question detection. Keep your API key private.</div>

<div class="controls">
  <button id="micBtn" class="primary" onclick="toggleMic()">Start Listening</button>
  <button id="pauseBtn" class="secondary" onclick="togglePause()">Pause Listening</button>
</div>

<div class="panel">
  <div class="label">Live transcript</div>
  <div id="transcript" class="transcript">Start listening and speak naturally.</div>
</div>

<div class="controls">
  <button class="clear" onclick="clearFeed()">Clear Answers</button>
  <button class="secondary" onclick="clearTranscript()">Clear Transcript</button>
</div>

<div id="feed"></div>

<div class="foot">
Speech recognition can occasionally mishear words or disconnect.
Check the transcript if it does not match what you said.
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

let recognition = null;
let listening = false;
let paused = false;
let busy = false;
let restarting = false;
let pending = "";
let interim = "";
let timer = null;
let wakeLock = null;
let lastQuestion = "";
let lastQuestionAt = 0;
let conversation = [];

const PAUSE_MS = 2200;

function setStatus(text, type = "") {
  $("status").textContent = text;
  $("status").className = "badge " + type;
}

function clean(text) {
  return text.replace(/\s+/g, " ").trim();
}

function tokens(text) {
  return clean(text).toLowerCase().match(/[\p{L}\p{N}']+/gu) || [];
}

// Remove duplicated consecutive filler words.
function removeRepeatedWords(text) {
  const words = clean(text).split(/\s+/);
  const out = [];

  for (const word of words) {
    const prev = (out[out.length - 1] || "")
      .toLowerCase().replace(/[.,!?]+/g, "");
    const curr = word.toLowerCase().replace(/[.,!?]+/g, "");

    if (curr === prev && /^(okay|ok|um|uh|hmm|yeah|so)$/i.test(curr)) {
      continue;
    }

    out.push(word);
  }

  return out.join(" ");
}

// Merge overlapping recognition chunks rather than appending them blindly.
function mergeSpeech(existing, incoming) {
  existing = clean(existing);
  incoming = clean(incoming);

  if (!existing) return removeRepeatedWords(incoming);
  if (!incoming) return existing;

  const a = tokens(existing);
  const b = tokens(incoming);

  if (!a.length || !b.length) return existing;

  // Ignore a repeated transcript or an already-heard shorter fragment.
  const normA = a.join(" ");
  const normB = b.join(" ");

  if (normA === normB || normA.endsWith(" " + normB)) {
    return existing;
  }

  // Find the largest overlap between the end of the existing transcript
  // and the start of the new fragment.
  let overlap = 0;
  const max = Math.min(a.length, b.length, 40);

  for (let n = 1; n <= max; n++) {
    const suffix = a.slice(-n).join(" ");
    const prefix = b.slice(0, n).join(" ");

    if (suffix === prefix) overlap = n;
  }

  let merged;

  if (overlap > 0) {
    merged = existing + " " + b.slice(overlap).join(" ");
  } else if (normB.startsWith(normA + " ")) {
    // Incoming transcript is a longer revision of the current text.
    merged = incoming;
  } else {
    merged = existing + " " + incoming;
  }

  return removeRepeatedWords(merged);
}

function showTranscript() {
  $("transcript").textContent =
    clean(pending + " " + interim) || "Listening for speech...";
}

function createCard(question) {
  const card = document.createElement("div");
  card.className = "card";

  const q = document.createElement("div");
  q.className = "question";
  q.textContent = "Practice question: " + question;

  const a = document.createElement("div");
  a.className = "answer";
  a.textContent = "Generating answer...";

  card.append(q, a);
  $("feed").prepend(card);
  return a;
}

function getKey() {
  const key = $("apiKey").value.replace(/[\s\u200B-\u200D\uFEFF]/g, "");
  return /^[\x21-\x7E]+$/.test(key) ? key : "";
}

function isIncomplete(text) {
  const s = clean(text).toLowerCase()
    .replace(/[.!?]+$/g, "").trim();

  if (s.length < 8) return true;

  const patterns = [
    /^(okay|ok|right|so|yeah|hmm|um|uh)$/,
    /^(okay|ok|so|right|now|first) (we|let's|lets|i|will|shall)$/,
    /^(what|why|how|when|where|who|which)$/,
    /^(what|why|how|when|where|who|which) (is|are|do|does|did|can|could|would|will|should)$/,
    /^(what about|how about|difference between|explain|define|describe|tell me about)$/,
    /^(how do you|how would you|what do you|what would you)$/
  ];

  if (patterns.some(p => p.test(s))) return true;

  // A topic introduction should not trigger an answer.
  if (/\b(let's|lets|we will|we'll|moving on|coming to)\b/i.test(s) &&
      !/[?]/.test(text) &&
      !/\b(how do you|how would you|what is|what are|explain|define|describe)\b/i.test(s)) {
    return true;
  }

  return false;
}

function looksLikeQuestion(text) {
  const s = clean(text);

  if (s.length < 12 || isIncomplete(s)) return false;

  return /[?]/.test(s) ||
    /^(what|why|how|when|where|who|which|can|could|would|should|do|does|did|is|are|explain|define|describe|compare|tell me)\b/i.test(s) ||
    /\b(how do you|how would you|what is|what are|difference between|write a query|find the|remove duplicates|handle null|explain the|describe the)\b/i.test(s);
}

function initSpeech() {
  const API = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!API) {
    alert("Speech recognition is unavailable. Try Chrome.");
    return null;
  }

  const rec = new API();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = "en-IN";
  rec.maxAlternatives = 1;

  rec.onresult = event => {
    if (paused || busy) return;

    let finalText = "";
    let interimText = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      const text = result[0].transcript;

      if (result.isFinal) finalText += text + " ";
      else interimText += text + " ";
    }

    if (finalText.trim()) {
      pending = mergeSpeech(pending, finalText);
      interim = "";
      scheduleDetection();
    }

    // Interim results are previews, not additional permanent text.
    interim = clean(interimText);
    showTranscript();
  };

  rec.onerror = event => {
    if (event.error === "not-allowed" ||
        event.error === "service-not-allowed") {
      listening = false;
      updateMicButton();
      setStatus("MIC DENIED", "red");
      $("transcript").textContent = "Allow microphone permission in browser settings.";
    } else if (event.error === "network") {
      setStatus("SPEECH NETWORK ERROR", "red");
      $("transcript").textContent =
        "Speech recognition network error. Check your connection and restart listening.";
    } else if (event.error !== "no-speech" &&
               event.error !== "aborted") {
      $("transcript").textContent = "Speech error: " + event.error;
    }
  };

  rec.onend = () => {
    restarting = false;

    if (!listening || paused) return;

    setTimeout(() => {
      if (!listening || paused || restarting) return;

      try {
        restarting = true;
        rec.start();
      } catch (e) {
        restarting = false;
      }
    }, 350);
  };

  return rec;
}

function scheduleDetection() {
  clearTimeout(timer);

  timer = setTimeout(() => {
    interim = "";
    showTranscript();

    if (looksLikeQuestion(pending)) {
      setStatus("QUESTION DETECTED", "green");
      autoAnswer();
    } else if (pending) {
      setStatus("LISTENING", "green");
    }
  }, PAUSE_MS);
}

async function toggleMic() {
  if (listening) {
    listening = false;
    clearTimeout(timer);

    try { recognition?.stop(); } catch (e) {}

    if (wakeLock) {
      try { await wakeLock.release(); } catch (e) {}
      wakeLock = null;
    }

    updateMicButton();
    setStatus("STANDBY");
    return;
  }

  if (!getKey()) {
    alert("Paste a valid Gemini API key first.");
    return;
  }

  if (!recognition) recognition = initSpeech();
  if (!recognition) return;

  try {
    recognition.start();
    listening = true;
    paused = false;
    $("pauseBtn").textContent = "Pause Listening";
    updateMicButton();
    setStatus("LISTENING", "green");
    $("transcript").textContent = "Listening. Speak naturally.";

    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
      }
    } catch (e) {}
  } catch (e) {
    setStatus("MIC ERROR", "red");
    $("transcript").textContent = "Could not start microphone. Retry.";
  }
}

function updateMicButton() {
  $("micBtn").textContent = listening ? "Stop Listening" : "Start Listening";
  $("micBtn").className = listening ? "stop" : "primary";
}

function togglePause() {
  paused = !paused;
  $("pauseBtn").textContent = paused ? "Resume Listening" : "Pause Listening";

  if (paused) {
    try { recognition?.stop(); } catch (e) {}
    setStatus("PAUSED", "orange");
  } else if (listening && recognition) {
    try { recognition.start(); } catch (e) {}
    setStatus("LISTENING", "green");
  }
}

function clearTranscript() {
  pending = "";
  interim = "";
  clearTimeout(timer);
  showTranscript();
  setStatus(listening ? "LISTENING" : "STANDBY", listening ? "green" : "");
}

function clearFeed() {
  $("feed").replaceChildren();
}

async function autoAnswer() {
  if (busy || paused) return;

  const question = clean(pending);
  if (!looksLikeQuestion(question)) return;

  const now = Date.now();

  if (question === lastQuestion && now - lastQuestionAt < 10000) return;

  pending = "";
  interim = "";
  lastQuestion = question;
  lastQuestionAt = now;
  clearTimeout(timer);

  busy = true;
  setStatus("GENERATING", "orange");

  const output = createCard(question);
  const key = getKey();

  const prompt = `
You are a concise mock-interview practice coach for ETL and Data Engineering.

Recent conversation context:
${conversation.slice(-8).join("\n") || "(None)"}

Current question:
${question}

Answer the current technical question accurately.
For SQL questions, show executable SQL first.
For conceptual questions, give a definition and concise bullets.
Keep answers under 100 words unless code needs more.
Use clear, practical language suitable for interview practice.
`;

  let answer = "";
  let errorMessage = "No response received.";

  const models = ["gemini-3.5-flash-lite", "gemini-3.8-flash"];

  try {
    for (const model of models) {
      try {
        const response = await fetch(
          "https://generativelanguage.googleapis.com/v1beta/models/" +
          model + ":generateContent",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "x-goog-api-key": key
            },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: {
                temperature: 0.2,
                maxOutputTokens: 300
              }
            })
          }
        );

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          errorMessage = data.error?.message || ("HTTP " + response.status);

          if ([400, 401, 403].includes(response.status)) break;
          continue;
        }

        const data = await response.json();
        answer = (data.candidates?.[0]?.content?.parts || [])
          .map(p => p.text || "").join("").trim();

        if (answer) break;
      } catch (e) {
        errorMessage = e.message || "Network error.";
      }
    }

    if (answer) {
      output.textContent = answer;
      conversation.push("Question: " + question + "\nAnswer: " + answer);
      conversation = conversation.slice(-8);
      setStatus("ANSWER READY", "green");
    } else {
      output.textContent = "Request failed: " + errorMessage;
      setStatus("REQUEST FAILED", "red");
    }
  } finally {
    busy = false;

    if (listening && !paused) {
      setStatus("LISTENING", "green");
      if (pending) scheduleDetection();
    } else if (!listening) {
      setStatus("STANDBY");
    }
  }
}

document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState === "visible" && listening && !wakeLock) {
    try {
      if ("wakeLock" in navigator) {
        wakeLock = await navigator.wakeLock.request("screen");
      }
    } catch (e) {}
  }
});
</script>
</body>
</html>
